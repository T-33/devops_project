name: Test Suite

# 1. TRIGGERS: When should this pipeline run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
# 2. JOBS: What tasks need to execute?
jobs:
  run-tests:
    runs-on: ubuntu-latest # The OS of the ephemeral runner VM

    steps:
      # Step 1: Download your repo's source code onto the VM
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Install Python on the VM
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install pytest and any dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute the test runner
      - name: Run Pytest
        run: |
          pytest -v
  
  build-and-push:
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN}}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):latest"
          
            echo "Pulling latest image: $IMAGE_NAME"
            docker pull $IMAGE_NAME
            
            echo "Stopping old container..."
            docker stop my-app || true
            docker rm my-app || true
            
            echo "Starting new container on port 80..."
            docker run -d \
              --name my-app \
              --restart unless-stopped \
              -p 80:8000 \
              $IMAGE_NAME
            
            echo "Cleaning up dangling images to save disk space"
            docker image prune -af --filter "until=24h"